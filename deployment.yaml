apiVersion: apps/v1
kind: Deployment
metadata:
  name: learnhub-deployment
  labels:
    app: learnhub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learnhub
  template:
    metadata:
      labels:
        app: learnhub
    spec:
      containers:
        - name: learnhub
          image: learnhub:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
